<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="kirmizi" cx="50%" cy="8%" r="60%">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#7a0000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
