  <g fill="#00ffcc" opacity=".45"><rect x="-90" y="120" width="8" height="4"/><rect x="-90" y="150" width="8" height="4"/><rect x="-160" y="240" width="8" height="4"/><rect x="870" y="130" width="8" height="4"/><rect x="950" y="260" width="8" height="4"/></g>
  <g fill="#ff3b3b" opacity=".6"><rect x="-160" y="200" width="8" height="4"/><rect x="870" y="160" width="8" height="4"/></g>
