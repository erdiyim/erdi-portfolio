  <circle cx="400" cy="200" r="70" fill="url(#disk)"/>
  <circle cx="400" cy="200" r="28" fill="#0c1013" stroke="#00ffcc" stroke-width="2"/>
  <circle cx="400" cy="200" r="18" fill="none" stroke="#00ffcc" stroke-opacity=".5" stroke-width="1"/>
