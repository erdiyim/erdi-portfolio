      <stop offset=".35" stop-color="#00ffcc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tarama" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity=".035"/>
    </pattern>
  </defs>
  <rect x="-200" width="1200" height="400" fill="url(#zemin)"/>
  <!-- geniş kart için yan duvarlar -->
