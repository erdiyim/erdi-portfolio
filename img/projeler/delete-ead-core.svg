    <rect x="130" y="150" width="6" height="3"/><rect x="130" y="170" width="6" height="3"/><rect x="150" y="190" width="6" height="3"/>
    <rect x="215" y="160" width="5" height="3"/><rect x="225" y="200" width="5" height="3"/>
    <rect x="660" y="150" width="6" height="3"/><rect x="640" y="180" width="6" height="3"/>
